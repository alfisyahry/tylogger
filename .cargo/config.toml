[build]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/ENTRY:mainCRTStartup",
    "-C", "link-arg=/DELAYLOAD:api-ms-win-core-synch-l1-2-0.dll",
