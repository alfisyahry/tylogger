name: Bug report
description: Report a reproducible problem using sanitized data.
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, personal information or production logs.
  - type: input
    id: version
    attributes:
      label: Tylogger version or commit
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and x86 or x64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sanitized sample, screenshots and relevant diagnostics
